<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>간단 마작</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <h1>간단 마작</h1>
        <p class="sub">동·남·서·북 자리 · 스프라이트 패 · 4인 론/쯔모</p>
      </header>

      <div id="page-grid">
        <div id="sidebar">
          <section id="panel-auth" class="card auth-card">
            <h2>로그인</h2>
            <div class="auth-form">
              <div class="form-group">
                <label for="auth-username">아이디</label>
                <input id="auth-username" type="text" maxlength="24" placeholder="아이디" autocomplete="username" />
              </div>
              <div class="form-group">
                <label for="auth-password">비밀번호</label>
                <div class="input-group password-group">
                  <input id="auth-password" type="password" maxlength="72" placeholder="비밀번호" autocomplete="current-password" />
                  <button type="button" id="btn-toggle-password" class="password-toggle" aria-label="비밀번호 표시">👁️</button>
                </div>
              </div>
              <div class="auth-actions row wrap">
                <button type="button" id="btn-login">로그인</button>
                <button type="button" id="btn-register">회원가입</button>
                <button type="button" id="btn-logout" class="ghost hidden">로그아웃</button>
              </div>
            </div>
            <p id="auth-line" class="muted"></p>
            <p id="me-line" class="muted"></p>
          </section>

          <section id="panel-lobby" class="card">
        <h2>게임 모드</h2>
        <div class="row wrap">
          <button type="button" id="btn-mode-normal" class="active">4인 4판</button>
          <button type="button" id="btn-mode-tonpufu">동풍전</button>
        </div>

        <h2>방</h2>
        <div class="row wrap">
          <button type="button" id="btn-create">방 만들기</button>
          <input id="room-code" type="text" maxlength="8" placeholder="방 코드" />
          <button type="button" id="btn-join">입장</button>
          <button type="button" id="btn-leave" class="ghost">나가기</button>
        </div>
        <p id="room-line" class="muted"></p>
        <div class="room-code-row hidden" id="room-code-row">
          <button type="button" id="btn-copy-room" class="ghost">코드 복사</button>
          <span id="room-code-display" class="muted"></span>
        </div>
        <div id="roster"></div>
        <div class="row wrap">
          <button type="button" id="btn-start" disabled>게임 시작 (4명·방장)</button>
        </div>
      </section>

      <section id="panel-chat" class="card">
        <h2>채팅</h2>
        <div id="chat-log" class="chat-log"></div>
        <div class="row">
          <input id="chat-input" type="text" maxlength="500" placeholder="메시지" />
          <button type="button" id="btn-chat">보내기</button>
        </div>
      </section>
        </div>

        <section id="panel-game" class="card table-card hidden">
        <div class="table-toolbar">
          <p id="game-status" class="status-main"></p>
          <div id="game-extra" class="status-extra"></div>
        </div>

        <div class="mahjong-table">
          <div class="compass-ring" aria-hidden="true">
            <span class="c c-n">북</span>
            <span class="c c-e">동</span>
            <span class="c c-s">남</span>
            <span class="c c-w">서</span>
          </div>
          <div id="zone-top" class="pz pz-top"></div>
          <div id="zone-left" class="pz pz-left"></div>
          <div class="table-mid">
            <div class="table-mid-inner">
              <div class="wall-count" id="wall-count-disp">—</div>
              <div class="wall-sub">남은 산패 · 테이블 위가 북쪽</div>
              <div class="round-wind" id="round-wind">장풍: 동</div>
              <div class="dora-display">
                <div class="dora-indicators" id="dora-indicators"></div>
                <div class="dora-label">도라 표시패</div>
              </div>
            </div>
          </div>
          <div id="zone-right" class="pz pz-right"></div>
          <div id="zone-bottom" class="pz pz-bottom"></div>
        </div>

        <p class="hand-label">내 패 (화면 아래 = 남쪽)</p>
        <div id="hand" class="hand"></div>
        <div id="naki-bar" class="naki-bar hidden">
          <span class="naki-hint">후로 (하가→차례)</span>
          <select id="chi-pair-select" class="chi-pair-select hidden" aria-label="치 조합"></select>
          <button type="button" id="btn-chi" class="ghost" disabled>치</button>
          <button type="button" id="btn-pon" class="ghost" disabled>펑</button>
          <button type="button" id="btn-pass-naki" class="ghost" disabled>후로 패스</button>
        </div>
        <div class="row wrap actions">
          <button type="button" id="btn-tsumo" disabled>쯔모</button>
          <button type="button" id="btn-ron" disabled>론</button>
          <button type="button" id="btn-pass-ron" disabled>론 패스</button>
          <button type="button" id="btn-kan" disabled>깡</button>
          <button type="button" id="btn-riichi" disabled>리치</button>
          <button type="button" id="btn-cheat" class="ghost hidden">치트</button>
        </div>
      </section>

      <div id="summary-modal" class="summary-modal hidden" aria-hidden="true">
        <div class="summary-card">
          <div class="summary-head">
            <h3>매국 결과</h3>
            <button type="button" id="btn-summary-close" class="ghost">닫기</button>
          </div>
          <div id="summary-body"></div>
          <div class="summary-actions">
            <button type="button" id="btn-summary-close-bottom" class="ghost">확인</button>
          </div>
        </div>
      </div>

      <p id="toast" class="toast hidden" role="status"></p>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
